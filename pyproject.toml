[tool.poetry]
name = "peepseek"
version = "0.1.0"
description = "Solana memecoin analysis agent using DeepSeek's foundational logic"
authors = ["Devin <devin@ai.dev>"]

[tool.poetry.dependencies]
python = "^3.12"
solana = "^0.30.2"
pandas = "^2.2.0"
requests = "^2.31.0"
aiohttp = "^3.9.3"
web3 = "^6.15.1"
python-dotenv = "^1.0.1"
transformers = "^4.37.2"
torch = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.1.1"
isort = "^5.13.2"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
